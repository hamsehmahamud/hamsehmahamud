<svg xmlns="http://w3.org" viewBox="0 0 950 140" width="100%">
  <style>
    @keyframes shift-color-1 {
      0% { stop-color: #ff007f; }
      33% { stop-color: #00f0ff; }
      66% { stop-color: #7f00ff; }
      100% { stop-color: #ff007f; }
    }
    @keyframes shift-color-2 {
      0% { stop-color: #7f00ff; }
      33% { stop-color: #ff007f; }
      66% { stop-color: #00f0ff; }
      100% { stop-color: #7f00ff; }
    }
    @keyframes subtle-movement {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
      100% { transform: translateY(0px); }
    }
    .stop1 { animation: shift-color-1 5s infinite linear; }
    .stop2 { animation: shift-color-2 5s infinite linear; }
    .animated-group {
      animation: subtle-movement 4s infinite ease-in-out;
    }
    .ascii-text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      font-weight: bold;
      fill: url(#rainbow-glow);
    }
  </style>
  <linearGradient id="rainbow-glow" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" class="stop1" />
    <stop offset="100%" class="stop2" />
  </linearGradient>
  
  <rect width="100%" height="100%" fill="#0d1117" rx="8"/>
  
  <g class="animated-group">
    <text x="50%" y="35" text-anchor="middle" class="ascii-text"> _   _   _   ___  ___  ____  _____     _   _ _   _ ____    _ __   _ _____ ___ </text>
    <text x="50%" y="55" text-anchor="middle" class="ascii-text">| | | | / \ |  \/  |/ ___|| ____|   | | | | | | |  _ \  / \\ \ / /|  ___|_ _|</text>
    <text x="50%" y="75" text-anchor="middle" class="ascii-text">| |_| |/ _ \| |\/| |\___ \|  _|     | |_| | | | | | | |/ _ \\ V / | |_   | | </text>
    <text x="50%" y="95" text-anchor="middle" class="ascii-text">|  _  / ___ \ |  | | ___) | |___    |  _  | |_| | |_| / ___ \| |  |  _|  | | </text>
    <text x="50%" y="115" text-anchor="middle" class="ascii-text">|_| |_/_/   \_\_|  |_|____/|_____|   |_| |_|\___/|____/_/   \_\_|  |_|   |___|</text>
  </g>
</svg>
